  <script>
    (function () {
      const C = window.QSCapsule;
      const tl = gsap.timeline({ paused: true });
      const cap = document.getElementById("hk-cap");
      const F = window.QS_FORMAT || "wide";
      const H = window.QS_H || 1080;
      // Where the heard line starts, and where it lands in the note.
      const P = {
        wide: { x0: 230, y0: 300, x1: 634, y1: 364, fs: 112 },
        feed: { x0: 80, y0: 200, x1: 116, y1: 370, fs: 96 },
        tall: { x0: 80, y0: 360, x1: 116, y1: 550, fs: 96 },
      }[F];
      C.setup(tl, cap);
      QSWorld.ribbons(tl, document.getElementById("hk-rib"), 0, 6);

      // Keyboard: the line, a slow push toward fn, the press on the music's first note.
      tl.fromTo("#hk-kbd-inner", { scale: 1 }, { scale: 1.06, duration: 1.25, ease: "power1.inOut" }, 0);
      tl.to("#hk-fn", { y: 9, boxShadow: "inset 0 1.5px 0 rgba(255,255,255,0.05), 0 1px 0 #0a0b0d, 0 6px 16px rgba(0,0,0,0.6)", duration: 0.08, ease: "power2.out" }, 1.0);
      tl.to("#hk-fn .g", { color: "#5ce1e6", duration: 0.12 }, 1.0);
      tl.fromTo("#hk-fn-glow", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 1.0);

      // Tilt up from the key to the screen.
      tl.fromTo("#hk-cam", { y: -H }, { y: 0, duration: 0.5, ease: "power3.inOut" }, 1.25);

      // Listening: the menu bar mark turns red, the capsule springs in, the desk dims.
      tl.to("#hk-mbqs", { backgroundColor: "#ff453a", duration: 0.15 }, 1.55);
      C.enter(tl, cap, 1.6);
      C.wave(tl, cap, 1.7, 3.3, 7);
      tl.fromTo("#hk-dim", { filter: "blur(0px) brightness(1)" },
        { filter: "blur(14px) brightness(0.3)", duration: 0.5, ease: "power2.inOut" }, 1.7);
      C.words(tl, cap, "#hk-raw", 1.9, 0.16);
      document.querySelectorAll("#hk-heard .hw").forEach(function (w, i) {
        tl.fromTo(w, { opacity: 0, filter: "blur(8px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, 1.9 + i * 0.16);
      });
      C.timer(tl, cap, [2.6]);

      // Let go: "um," is struck and drops out, then the check.
      tl.to("#hk-mbqs", { backgroundColor: "#f5f7fa", duration: 0.15 }, 3.3);
      C.processing(tl, cap, 3.3);
      tl.fromTo("#hk-um-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.2, ease: "power2.out" }, 3.35);
      tl.to("#hk-um .hw", { color: "rgba(245,247,250,0.38)", duration: 0.15 }, 3.35);
      tl.to("#hk-um", { maxWidth: 0, opacity: 0, filter: "blur(6px)", duration: 0.42, ease: "power3.inOut" }, 3.62);
      C.swapLive(tl, cap, "#hk-raw", "#hk-clean", 3.62);
      C.done(tl, cap, 3.95);
      C.leave(tl, cap, 4.25);

      // Carry: the sentence shrinks into the note as the desk comes back.
      tl.to("#hk-dim", { filter: "blur(0px) brightness(1)", duration: 0.55, ease: "power2.inOut" }, 4.1);
      tl.to("#hk-heard", { x: P.x1 - P.x0, y: P.y1 - P.y0, scale: 44 / P.fs, color: "#151a21", duration: 0.65, ease: "power3.inOut" }, 4.1);
      tl.to("#hk-caret", { opacity: 1, duration: 0.1 }, 4.75);

      // Out: the window falls away; the wallpaper carries into the title.
      tl.to(["#hk-notes", "#hk-heard"], { y: "+=70", opacity: 0, filter: "blur(10px)", duration: 0.38, ease: "power3.in" }, 5.55);
      tl.to("#hk-mb", { opacity: 0, duration: 0.3, ease: "power2.in" }, 5.6);

      window.__timelines["hook"] = tl;
    })();
  </script>
